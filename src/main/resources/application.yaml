spring:
  application:
    name: financial-account-balance-tracker

server:
  port: 8081

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true

tracker:
  producer:
    enabled: true
  audit:
    submission-size: 1000
    queue-capacity: 4
